<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Asistente Técnico
    </title>
</head>

<body>

    <h1>
        Asistente Técnico
    </h1>

    <p id="estado">
        Cargando base de conocimiento...
    </p>

    <input
        type="text"
        id="pregunta"
        placeholder="Escribe una consulta"
    >

    <button id="botonConsultar">
        Consultar
    </button>

    <pre id="respuesta"></pre>


    <script src="js/motor_busqueda.js"></script>

    <script>

        const estado =
            document.getElementById(
                "estado"
            );

        const pregunta =
            document.getElementById(
                "pregunta"
            );

        const boton =
            document.getElementById(
                "botonConsultar"
            );

        const respuesta =
            document.getElementById(
                "respuesta"
            );


        async function iniciar() {

            const resultado =
                await window
                    .AsistenteMotor
                    .inicializar();

            if (resultado.ok) {

                estado.textContent =
                    "Base de conocimiento cargada.";

            } else {

                estado.textContent =
                    "Error cargando la base.";
            }
        }


        boton.addEventListener(
            "click",
            function () {

                const texto =
                    pregunta.value.trim();

                const resultado =
                    window
                        .AsistenteMotor
                        .consultar(
                            texto
                        );

                respuesta.textContent =
                    resultado.respuesta;
            }
        );


        pregunta.addEventListener(
            "keydown",
            function (evento) {

                if (
                    evento.key === "Enter"
                ) {

                    boton.click();
                }
            }
        );


        iniciar();

    </script>

</body>

</html>
